name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, personal-staging]

permissions:
  contents: read

jobs:
  test:
    name: Engine + skill + dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Seed to the path the loader actually imports from. profile.ts does
      # `import ... from "./profile.json"`, so the file must be its sibling —
      # a copy at the repo root type-checks nowhere and deploys nowhere.
      - name: Seed profile.json
        run: cp profile.example.json supabase/functions/_shared/profile.json

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Every Deno step below resolved its whole module graph over the network on
      # every run, so any third-party CDN blip failed the build. Twice observed:
      # `Import 'https://esm.sh/@supabase/supabase-js@2' failed: 522` (Cloudflare
      # connection timeout) on 2026-07-29 and 2026-08-03, both times a re-run with
      # no code change went green. deno.lock pins integrity, not availability — a
      # locked dependency is still fetched.
      #
      # restore-keys matters as much as key: a lockfile change then restores the
      # previous cache and fetches only the delta, instead of going fully cold.
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'supabase/functions/open-brain-mcp/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # Warms the cache in one place so a cold run has exactly one network-facing
      # step to retry, instead of five that each fail differently. On a warm cache
      # this is a no-op. Covers every entrypoint the four Deno steps below compile
      # — verified by running all four with --cached-only against a cold DENO_DIR
      # seeded only by these two commands: 281 tests passed with zero network.
      - name: Prefetch Deno dependencies (retried)
        run: |
          prefetch() {
            deno cache --config supabase/functions/open-brain-mcp/deno.json \
              supabase/functions/open-brain-mcp/*.ts &&
            deno cache \
              supabase/functions/brain-digest/*.ts \
              supabase/functions/_shared/*.ts \
              tests/*.ts \
              tests/_shared/*.ts
          }
          for attempt in 1 2 3; do
            if prefetch; then exit 0; fi
            echo "::warning::Dependency prefetch attempt $attempt failed (esm.sh returns 522 intermittently); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Dependency prefetch failed after 3 attempts — likely a sustained registry outage, not a code fault"
          exit 1

      # Whole directory, not one named file. CI previously ran only
      # _agent_tasks_test.ts, so every other suite in this workspace could ship
      # broken and stay green.
      - name: Run engine Deno tests (open-brain-mcp)
        run: deno test --allow-read --allow-env --config supabase/functions/open-brain-mcp/deno.json supabase/functions/open-brain-mcp/

      # Separate step because deno.json's workspace scopes resolution to
      # open-brain-mcp, so these suites are invisible to the run above.
      - name: Run Deno tests (brain-digest, _shared)
        run: deno test --allow-read --allow-env supabase/functions/brain-digest/ supabase/functions/_shared/

      # The repo-root tests/ directory was not run by CI at all. The dashboard
      # step below runs `tests/*.test.mjs` but under `working-directory:
      # dashboard`, so it never matched these — and the .ts suffix means no
      # node:test glob would have matched them anyway. Eight cross-cutting
      # wiring and contract suites shipped green by omission, including
      # public_sanitation_test.ts, the one that keeps private references out of
      # public files. Whole directory, for the same reason as the steps above.
      - name: Run repo-root Deno tests (wiring + contract suites)
        run: deno test --allow-read --allow-env tests/

      # Type-checks the whole module graph, including the profile.json import.
      # This is what catches a fresh-clone break that the tests above miss.
      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/open-brain-mcp/deno.json supabase/functions/open-brain-mcp/index.ts

      - name: Verify queue-runner skill contract
        run: node skills/queue-runner/verify.mjs

      # Globbed, not named one by one. Naming each file is how a new suite ships
      # green locally and never runs in CI at all.
      - name: Run open-engine tests
        run: node --test scripts/open-engine/*.test.mjs

      # The .sh suites were previously not run by CI at all — only the .mjs ones
      # were, so every bash test in the repo shipped green by omission. Globbed
      # for the same reason as the step above. `git config` is needed because
      # the worktree suites create a scratch worktree, and actions/checkout
      # leaves no committer identity configured.
      - name: Run shell test suites (open-engine + hooks)
        run: |
          git config user.email "ci@example.invalid"
          git config user.name "CI"
          status=0
          for t in scripts/open-engine/*.test.sh scripts/hooks/*.test.sh; do
            [ -e "$t" ] || continue
            echo "--- $t"
            bash "$t" || status=1
          done
          exit $status

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run dashboard node:test suites
        working-directory: dashboard
        run: node --test tests/*.test.mjs

      - name: Type-check dashboard
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build dashboard
        working-directory: dashboard
        env:
          # Build-time env stubs. The dashboard reads real secrets at runtime via Railway,
          # but Next.js's lint/type pass crashes if these are unset at build time.
          SUPABASE_URL: https://ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          OPENROUTER_API_KEY: ci-placeholder
          DASHBOARD_PASSWORD: ci-placeholder
          BRAIN_BANK_URL: https://ci.invalid
          BRAIN_BANK_API_KEY: ci-placeholder
        run: npm run build
